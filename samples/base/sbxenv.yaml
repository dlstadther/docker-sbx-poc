# Docker Sandboxes environment for this project. `sbx env run` reads this
# file and merges ~/.sbxenv.yaml beneath it (agent, kits, ~/.claude mounts).
# Build the template first: see Dockerfile.sbx.
schemaVersion: "1"
sandboxOptions:
  # Change "my-project" to a short name for your project. sbx.sh reads this value.
  template: local/my-project-sbx:v1
  pullPolicy: never
env: {}
args:
  gitCommonDir:
    required: true
    description: Absolute path of the main repository .git folder. sbx.sh sets it.
# In a git worktree, .git is a file that points into the main repository .git
# folder. That folder is outside the workspace, so git fails unless it is mounted.
# hooks/ and config stay read-only: git on the host runs what they name, so a
# writable copy lets the sandbox run commands on the host.
additionalWorkspaces:
  - path: ${{ env.args.gitCommonDir }}
  - path: ${{ env.args.gitCommonDir }}/hooks
    readOnly: true
  - path: ${{ env.args.gitCommonDir }}/config
    readOnly: true
