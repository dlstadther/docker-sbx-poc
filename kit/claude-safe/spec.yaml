schemaVersion: "2"
kind: sandbox
name: claude-safe
extends: claude

# sbx mounts host paths at the same absolute path inside the sandbox, so this
# points Claude Code at the host ~/.claude that sbxenv.yaml mounts.
# setup.sh replaces __HOME__ with your $HOME, because kit values do not
# expand ~ or $HOME.
environment:
  variables:
    CLAUDE_CONFIG_DIR: __HOME__/.claude
    # The sandbox does not mount the host ~/.config/uv. This URL has no
    # secret, because the proxy adds the token (see artifactory below).
    # setup.sh replaces XXXXXX.jfrog.io with ARTIFACTORY_HOST.
    UV_DEFAULT_INDEX: https://XXXXXX.jfrog.io/artifactory/api/pypi/pypi/simple
    # The project directory is shared with the host, and its .venv links to a
    # macOS Python that does not exist in the sandbox. A relative name gives
    # each uv project (for example a subproject) its own sandbox venv.
    # Add .venv-sbx/ to .git/info/exclude in each project.
    UV_PROJECT_ENVIRONMENT: .venv-sbx

# The sandbox sees GH_TOKEN=proxy-managed. The real token stays on the host,
# and the sbx proxy adds it to requests to api.github.com. setup.sh stores the
# token with `sbx secret set github`.
credentials:
  - service: github
    description: GitHub CLI token, for `gh` API calls (PR creation, etc.)
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          scheme: bearer

  # The real token stays in the host Keychain. setup.sh stores it with
  # `sbx secret set artifactory`. uv sends no auth, and the proxy adds a
  # Bearer header, which Artifactory accepts for identity tokens.
  - service: artifactory
    description: JFrog identity token, for uv installs from Artifactory
    apiKey:
      name: ARTIFACTORY_TOKEN
      proxyManaged: true
      inject:
        - domain: XXXXXX.jfrog.io
          scheme: bearer

permissions:
  network:
    # Python builds and system packages come from the project template,
    # not from the network. See the project's Dockerfile.sbx.
    allow:
      - api.github.com
      - github.com
      - raw.githubusercontent.com
      - XXXXXX.jfrog.io
      # Artifactory redirects package downloads to signed S3 URLs. The proxy
      # must not add the token here, so no credential targets this host.
      - jfrog-prod-use1-shared-virginia-main.s3.amazonaws.com
